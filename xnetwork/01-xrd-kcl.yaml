apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xnetworks.consumable.minisrc.com
spec:
  scope: Namespaced
  group: consumable.minisrc.com
  names:
    kind: xNetwork
    plural: xnetworks
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              name:
                type: string
              location:
                type: string
                oneOf:
                - pattern: '^ap-southeast-1$'
              vpcCidr:
                type: string
              subnets:
                type: object
                properties:
                  public:
                    type: object
                    properties:
                      1a:
                        type: string
                      1b:
                        type: string
                      1c:
                        type: string
            required:
            - name
    served: true
    referenceable: true