            spec = {
              forProvider = {
                chart = {
                  name = "karpenter"
                  repository = "oci://public.ecr.aws/karpenter"
                  version = oxr.spec.components.karpenterHelm.version
                }
                set = [
                  {
                    name = "settings.clusterName"
                    value = oxr.spec.name + "-xplane-eks-cluster"
