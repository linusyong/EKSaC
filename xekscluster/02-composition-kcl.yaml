  - step: create-karpenter-iam
    functionRef:
      name: function-kcl
    input:
      apiVersion: krm.kcl.dev/v1alpha1
      kind: KCLInput
      metadata:
        name: "xplane-karpenter-iam"
      spec:
        target: Default
        source: |
          import json
          import regex

          oxr = option("params").oxr
          ocds = option("params").ocds

          oidcissuer = regex.replace(ocds[oxr.spec.name + "-xplane-eks-cluster"]?.Resource?.status?.atProvider?.identity?[0]?.oidc?[0]?.issuer or "", "https://", "")

          policy = {
            apiVersion = "iam.aws.m.upbound.io/v1beta1"
            kind = "Policy"
            metadata = {
              name = oxr.spec.name + "-xplane-karpenter-iam-policy"
              namespace = oxr.metadata.namespace
            }
            spec.forProvider = {
              policy = json.encode({
                "Statement": [
                  {
                    "Action": [
                      "ssm:GetParameter",
                      "pricing:GetProducts",
                      "iam:TagInstanceProfile",
                      "iam:PassRole",
                      "iam:GetInstanceProfile",
                      "iam:CreateInstanceProfile",
                      "iam:AddRoleToInstanceProfile",
                      "ec2:TerminateInstances",
                      "ec2:RunInstances",
                      "ec2:DescribeSubnets",
                      "ec2:DescribeSpotPriceHistory",
                      "ec2:DescribeSecurityGroups",
                      "ec2:DescribeLaunchTemplates",
                      "ec2:DescribeInstances",
                      "ec2:DescribeInstanceTypes",
                      "ec2:DescribeInstanceTypeOfferings",
                      "ec2:DescribeImages",
                      "ec2:DescribeAvailabilityZones",
                      "ec2:DeleteLaunchTemplate",
                      "ec2:CreateTags",
                      "ec2:CreateLaunchTemplate",
                      "ec2:CreateFleet"
                    ],
                    "Effect": "Allow",
                    "Resource": "*",
                    "Sid": "Karpenter"
                  },
                  {
                    "Action": "ec2:TerminateInstances",
                    "Condition": {
                      "StringLike": {
                        "ec2:ResourceTag/Name": "*karpenter*"
                      }
                    },
                    "Effect": "Allow",
                    "Resource": "*",
                    "Sid": "ConditionalEC2Termination"
                  },
                  {
                    "Action": [
                      "sqs:ReceiveMessage",
                      "sqs:GetQueueUrl",
                      "sqs:GetQueueAttributes",
                      "sqs:DeleteMessage"
                    ],
                    "Effect": "Allow",
                    "Resource": "*",
                    "Sid": "KarpenterSQS"
                  },
                  {
                    "Action": "iam:PassRole",
                    "Effect": "Allow",
                    "Resource": "arn:aws:iam::" + oxr.spec.awsAccountId + ":role/" + oxr.spec.name + "-xplane-eks-cluster",
                    "Sid": "PassNodeIAMRole"
                  },
                  {
                    "Action": "eks:DescribeCluster",
                    "Effect": "Allow",
                    "Resource": "arn:aws:eks:ap-southeast-1:" + oxr.spec.awsAccountId + ":cluster/" + oxr.spec.name + "-xplane-eks-cluster",
                    "Sid": "EKSClusterEndpointLookup"
                  }
                ],
                "Version": "2012-10-17"
              })
              tags: {
                Name = oxr.spec.name + "-xplane-karpenter-iam-policy"
                Owner = "linus.yong"
                Environment = "sandbox"
                Project = "crossplane"
              }
            }
            spec.providerConfigRef = {
              kind = "ProviderConfig"
              name = "provider-aws-iam"
            }
          }

          role = {
            apiVersion = "iam.aws.m.upbound.io/v1beta1"
            kind = "Role"
            metadata = {
              name = oxr.spec.name + "-xplane-karpenter-iam-role"
              namespace = oxr.metadata.namespace
            }
            spec.forProvider = {
              assumeRolePolicy = json.encode({
                Version = "2012-10-17"
                Statement = [{
                  "Effect": "Allow",
                  "Principal": {
                    "Federated": "arn:aws:iam::" + oxr.spec.awsAccountId + ":oidc-provider/" + oidcissuer
                  },
                  "Action": "sts:AssumeRoleWithWebIdentity",
                  "Condition": {
                    "StringEquals": {
                      oidcissuer + ":sub": "system:serviceaccount:kube-system:karpenter"
                    }
                  }
                }]
              })
              tags: {
                Name = oxr.spec.name + "-xplane-karpenter-iam-role"
                Owner = "linus.yong"
                Environment = "sandbox"
                Project = "crossplane"
              }
            }
            spec.providerConfigRef = {
              kind = "ProviderConfig"
              name = "provider-aws-iam"
            }
          }

          attachement = {
            apiVersion = "iam.aws.m.upbound.io/v1beta1"
            kind = "RolePolicyAttachment"
            metadata = {
              name = oxr.spec.name + "-xplane-karpenter-policy-attachment"
              namespace = oxr.metadata.namespace
            }
            spec.forProvider = {
              policyArnRef.name = oxr.spec.name + "-xplane-karpenter-iam-policy"
              roleRef.name = oxr.spec.name + "-xplane-karpenter-iam-role"
            }
            spec.providerConfigRef = {
              kind = "ProviderConfig"
              name = "provider-aws-iam"
            }
          }

          noderole = {
            apiVersion = "iam.aws.m.upbound.io/v1beta1"
            kind = "Role"
            metadata = {
              name = oxr.spec.name + "-xplane-karpenter-node-iam"
              namespace = oxr.metadata.namespace
            }
            spec.forProvider = {
              assumeRolePolicy = json.encode({
                "Version": "2012-10-17",
                "Statement": [
                    {
                        "Effect": "Allow",
                        "Principal": {
                            "Service": "ec2.amazonaws.com"
                        },
                        "Action": "sts:AssumeRole"
                    }
                ]
              })
              managedPolicyArns = [
                "arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy",
                "arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy",
                "arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryPullOnly",
                "arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore"
              ]
              tags: {
                Name = oxr.spec.name + "-xplane-karpenter-node-iam"
                Owner = "linus.yong"
                Environment = "sandbox"
                Project = "crossplane"
              }
            }
            spec.providerConfigRef = {
              kind = "ProviderConfig"
              name = "provider-aws-iam"
            }
          }

          items = [policy, role, attachement, noderole]
  - step: helm-install-karpenter
    functionRef:
      name: function-kcl
    input:
      apiVersion: krm.kcl.dev/v1beta1
      kind: KCLInput
      metadata:
        name: "xplane-helm-karpenter"
