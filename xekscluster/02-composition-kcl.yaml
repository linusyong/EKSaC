  - step: create-karpenter-restart-cronjob
    functionRef:
      name: function-kcl
    input:
      apiVersion: krm.kcl.dev/v1alpha1
      kind: KCLInput
      metadata:
        name: "xplane-karpenter-restart-cronjob"
      spec:
        target: Default
        source: |
          oxr = option("params").oxr

          karpentercronjobrole = {
            apiVersion = "kubernetes.m.crossplane.io/v1alpha1"
            kind = "Object"
            metadata = {
              name = oxr.spec.name + "-xplane-role-restart-karpenter"
              namespace = oxr.metadata.namespace
            }
            spec = {
              forProvider = {
                manifest = {
                  apiVersion = "rbac.authorization.k8s.io/v1"
                  kind = "Role"
                  metadata = {
                    name = oxr.spec.name + "-xplane-role-restart-karpenter"
                    namespace = "kube-system"
                  }
                  rules = [
                    {
                      apiGroups = ["apps", "extensions"]
                      resources = ["deployments"]
                      resourceNames = ["karpenter"]
                      verbs = ["get", "list", "patch", "watch"]
                    }
                  ]
                }
              }
              providerConfigRef = {
                kind = "ProviderConfig"
                name = oxr.spec.name + "-providerconfig-kubernetes"
              }
            }
          }

          karpentercronjobsa = {
            apiVersion = "kubernetes.m.crossplane.io/v1alpha1"
            kind = "Object"
            metadata.name = oxr.spec.name + "-xplane-sa-restart-karpenter"
            spec = {
              forProvider = {
                manifest = {
                  apiVersion = "v1"
                  kind = "ServiceAccount"
                  metadata = {
                    name = oxr.spec.name + "-xplane-sa-restart-karpenter"
                    namespace = "kube-system"
                  }
                }
              }
              providerConfigRef = {
                kind = "ProviderConfig"
                name = oxr.spec.name + "-providerconfig-kubernetes"
              }
            }
          }

          karpentercronjobrolebinding = {
            apiVersion = "kubernetes.m.crossplane.io/v1alpha1"
            kind = "Object"
            metadata.name = oxr.spec.name + "-xplane-rolebinding-restart-karpenter"
            spec = {
              forProvider = {
                manifest = {
                  apiVersion = "rbac.authorization.k8s.io/v1"
                  kind = "RoleBinding"
                  metadata = {
                    name = oxr.spec.name + "-xplane-rolebinding-restart-karpenter"
                    namespace = "kube-system"
                  }
                  roleRef = {
                    apiGroup = "rbac.authorization.k8s.io"
                    kind = "Role"
                    name = oxr.spec.name + "-xplane-role-restart-karpenter"
                  }
                  subjects = [
                    {
                      kind = "ServiceAccount"
                      name = oxr.spec.name + "-xplane-sa-restart-karpenter"
                      namespace = "kube-system"
                    }
                  ]
                }
              }
              providerConfigRef = {
                kind = "ProviderConfig"
                name = oxr.spec.name + "-providerconfig-kubernetes"
              }
            }
          }

          karpentercronjob = {
            apiVersion = "kubernetes.m.crossplane.io/v1alpha1"
            kind = "Object"
            metadata.name = oxr.spec.name + "-xplane-cronjob-karpenter"
            spec = {
              forProvider = {
                manifest = {
                  apiVersion = "batch/v1"
                  kind = "CronJob"
                  metadata = {
                    name = oxr.spec.name + "-xplane-cronjob-karpenter"
                    namespace = "kube-system"
                  }
                  spec = {
                    schedule = "0 */1 * * *"
                    successfulJobsHistoryLimit = 1
                    failedJobsHistoryLimit = 3
                    concurrencyPolicy = "Forbid"
                    jobTemplate = {
                      spec = {
                        backoffLimit = 2
                        activeDeadlineSeconds = 600 
                        ttlSecondsAfterFinished = 120
                        template = {
                          spec = {
                            serviceAccountName = oxr.spec.name + "-xplane-sa-restart-karpenter"
                            tolerations = [
                              {
                                key = "karpenter.sh/nodepool"
                                operator = "Equal"
                                value = "infra"
                                effect = "NoSchedule"
                              }
                            ]
                            containers = [
                              {
                                name = oxr.spec.name + "-xplane-cronjob-karpenter"
                                image = "bitnami/kubectl"
                                command = ["sh", "-c", "kubectl rollout restart deployment karpenter -n kube-system"]
                              }
                            ]
                            restartPolicy = "OnFailure"
                          }
                        }
                      }
                    }
                  }
                }
              }
              providerConfigRef = {
                kind = "ProviderConfig"
                name = oxr.spec.name + "-providerconfig-kubernetes"
              }
            }
          }

          items = [karpentercronjobrole, karpentercronjobsa, karpentercronjobrolebinding, karpentercronjob]
  - step: helm-install-cilium
    functionRef:
      name: function-kcl
    input:
      apiVersion: krm.kcl.dev/v1alpha1
      kind: KCLInput
      metadata:
        name: "xplane-helm-cilium"
      spec:
        target: Default
        source: |
          import regex
          import yaml

          oxr = option("params").oxr
          ocds = option("params").ocds

          kendpoint = regex.replace(ocds[oxr.spec.name + "-xplane-eks-cluster"]?.Resource?.status?.atProvider?.endpoint or "", "https://", "")

          items = [{
            apiVersion = "helm.m.crossplane.io/v1beta1"
            kind = "Release"
            metadata = {
              name = oxr.spec.name + "-xplane-helm-cilium"
              namespace = oxr.metadata.namespace
              annotations = {
                "crossplane.io/external-name" = "cilium"
              }
            }
            spec = {
              forProvider = {
                chart = {
                  name = "cilium"
                  repository = "https://helm.cilium.io/"
                  version = oxr.spec.components.ciliumHelm.version
                }
                namespace = "kube-system"
                set = [
                  {
                    name = "eni.enabled"
                    value = "true"
                  },
                  {
                    name = "ipam.mode"
                    value = "eni"
                  },
                  {
                    name = "egressMasqueradeInterfaces"
                    value = "eth+"
                  },
                  {
                    name = "routingMode"
                    value = "native"
                  },
                  {
                    name = "kubeProxyReplacement"
                    value = "true"
                  },
                  {
                    name = "k8sServiceHost"
                    value = kendpoint
                  },
                  {
                    name = "k8sServicePort"
                    value = "443"
                  },
                  {
                    name = "cni.exclusive"
                    value = "false"
                  },
                  {
                    name = "socketLB.hostNamespaceOnly"
                    value = "true"
                  },
                  {
                    name = "operator.replicas"
                    value = "1"
                  }
                ]
                values = {
                  affinity = {
                    nodeAffinity = {
                      requiredDuringSchedulingIgnoredDuringExecution = {
                        nodeSelectorTerms = [
                          {
                            matchExpressions = [
                              {
                                key = "eks.amazonaws.com/compute-type"
                                operator = "NotIn"
                                values = ["fargate"]
                              }
                            ]
                          }
                        ]
                      }
                    }
                  }
                  envoy = {
                    affinity = {
                      nodeAffinity = {
                        requiredDuringSchedulingIgnoredDuringExecution = {
                          nodeSelectorTerms = [
                            {
                              matchExpressions = [
                                {
                                  key = "eks.amazonaws.com/compute-type"
                                  operator = "NotIn"
                                  values = ["fargate"]
                                }
                              ]
                            }
                          ]
                        }
                      }
                    }
                  }
                  operator = {
                    tolerations = [
                      {
                        key = "karpenter.sh/nodepool"
                        operator = "Equal"
                        value = "infra"
                        effect = "NoSchedule"
                      }
                    ]
                  }
                }
                wait = True
              }
              providerConfigRef = {
                kind = "ProviderConfig"
                name = oxr.spec.name + "-providerconfig-helm"
              }
            }
          }]
