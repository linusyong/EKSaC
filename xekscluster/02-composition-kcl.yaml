      kind: KCLInput
      metadata:
        name: "xplane-default-arm64-nodepool-karpenter"
      spec:
        target: Default
        source: |
          oxr = option("params").oxr

          items = [{
            apiVersion = "kubernetes.m.crossplane.io/v1alpha1"
            kind = "Object"
            metadata.name = oxr.spec.name + "-xplane-default-arm64-nodepool-karpenter"
            spec = {
              forProvider = {
                manifest = {
                  apiVersion = "karpenter.sh/v1"
                  kind = "NodePool"
                  metadata = {
                    name = "infra-arm64"
                    namespace = oxr.metadata.namespace
                  }
                  spec = {
                    disruption = {
                      consolidationPolicy = "WhenEmptyOrUnderutilized"
                      consolidateAfter = "3s"
                    }
                    template = {
                      metadata = {
                        labels = {
                          "managed-by" = "karpenter"
                        }
                      }
                      spec = {
                        nodeClassRef = {
                          group = "karpenter.k8s.aws"
                          kind = "EC2NodeClass"
                          name = "default"
                        }
                        startupTaints = [
                          {
                            key = "node.cilium.io/agent-not-ready"
                            value = "true"
                            effect = "NoExecute"
                          }
                        ]
                        taints = [
                          {
                            key = "karpenter.sh/nodepool"
                            value = "infra"
                            effect = "NoSchedule"
                          }
                        ]
                        requirements = [
                          {
                            key = "kubernetes.io/arch"
                            operator = "In"
                            values = ["arm64"]
                          },
                          {
                            key = "kubernetes.io/os"
                            operator = "In"
                            values = ["linux"]
                          },
                          {
                            key = "karpenter.k8s.aws/instance-cpu"
                            operator = "Gt"
                            values = ["2"]
                          },
                          {
                            key = "karpenter.sh/capacity-type"
                            operator = "In"
                            values = ["spot"]
                          }
                        ]
                        expireAfter = "2h"
                      }
                    }
                    weight = 50
                  }
                }
              }
              providerConfigRef = {
                kind = "ProviderConfig"
                name = oxr.spec.name + "-providerconfig-kubernetes"
              }
            }
          }]
