apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: x-ekscluster
spec:
  compositeTypeRef:
    apiVersion: consumable.trustbank.sg/v1alpha1
    kind: xEksCluster
  mode: Pipeline
  pipeline:
  - step: create-helm-providerconfig
    functionRef:
      name: function-kcl
    input:
      apiVersion: krm.kcl.dev/v1alpha1
      kind: KCLInput
      metadata:
        name: "providerconfig-helm"
      spec:
        target: Default
        source: |
          oxr = option("params").oxr

          items = [{
            apiVersion = "helm.m.crossplane.io/v1beta1"
            kind = "ProviderConfig"
            metadata = {
              name = oxr.spec.name + "-providerconfig-helm"
              namespace = oxr.metadata.namespace
              annotations = {
                "krm.kcl.dev/ready" = "True"
              }
            }
            spec = {
              credentials = {
                secretRef = {
                  key = "kubeconfig"
                  name = oxr.spec.name + "-xplane-eks-cluster-auth"
                  namespace = oxr.metadata.namespace
                }
                source = "Secret"
              }
            }
          }]
  - step: create-kubernetes-providerconfig
    functionRef:
      name: function-kcl
    input:
      apiVersion: krm.kcl.dev/v1alpha1
      kind: KCLInput
      metadata:
        name: "providerconfig-kubernetes"
      spec:
        target: Default
        source: |
          oxr = option("params").oxr

          items = [{
            apiVersion = "kubernetes.m.crossplane.io/v1alpha1"
            kind = "ProviderConfig"
            metadata = {
              name = oxr.spec.name + "-providerconfig-kubernetes"
              namespace = oxr.metadata.namespace
              annotations = {
                "krm.kcl.dev/ready" = "True"
              }
            }
            spec = {
              credentials = {
                secretRef = {
                  key = "kubeconfig"
                  name = oxr.spec.name + "-xplane-eks-cluster-auth"
                  namespace = oxr.metadata.namespace
                }
                source = "Secret"
              }
            }
          }]
  - step: create-private-subnets
    functionRef:
      name: function-kcl
    input:
      apiVersion: krm.kcl.dev/v1alpha1
      kind: KCLInput
      metadata:
        name: "xplane-subnets"
      spec:
        target: Default
        source: |
          oxr = option("params").oxr
          private_subnets = oxr.spec.subnets.private

          items = [{
            apiVersion = "ec2.aws.m.upbound.io/v1beta1"
            kind = "Subnet"
            metadata = {
              name = oxr.spec.name + "-xplane-private-subnet-" + zone
              namespace = oxr.metadata.namespace
            }
            spec.forProvider = {
              region = oxr.spec.location
              availabilityZone = "ap-southeast-" + zone
              cidrBlock = cidr
              tags: {
                Name = oxr.spec.name + "-xplane-private-subnet-" + zone
                Owner = "linus.yong"
                Environment = "sandbox"
                Project = "crossplane"
              }
              vpcIdRef.name = oxr.spec.vpcRef + "-xplane-vpc"
            }
            spec.providerConfigRef = {
              kind = "ProviderConfig"
              name = "provider-aws-ec2"
            }
          } for zone, cidr in private_subnets]
  - step: create-eks-iam-role
    functionRef:
      name: function-kcl
    input:
      apiVersion: krm.kcl.dev/v1alpha1
      kind: KCLInput
      metadata:
        name: "xplane-eks-iam-role"
      spec:
        target: Default
        source: |
          import json
          oxr = option("params").oxr

          items = [{
            apiVersion = "iam.aws.m.upbound.io/v1beta1"
            kind = "Role"
            metadata = {
              name = oxr.spec.name + "-xplane-eks-iam-role"
              namespace = oxr.metadata.namespace
            }
            spec.forProvider = {
              assumeRolePolicy = json.encode({
                "Version" = "2012-10-17"
                "Statement" = [{
                  "Effect" = "Allow"
                  "Principal" = {
                    "Service" = "eks.amazonaws.com"
                  }
                  "Action" = "sts:AssumeRole"
                }]
              })
              managedPolicyArns = [
                "arn:aws:iam::aws:policy/AmazonEKSClusterPolicy"
              ]
              tags: {
                Name = oxr.spec.name + "-xplane-eks-iam-role"
                Owner = "linus.yong"
                Environment = "sandbox"
                Project = "crossplane"
              }
            }
            spec.providerConfigRef = {
              kind = "ProviderConfig"
              name = "provider-aws-ec2"
            }
          }]
  - step: create-eks-cluster-securitygroups
    functionRef:
      name: function-kcl
    input:
      apiVersion: krm.kcl.dev/v1alpha1
      kind: KCLInput
      metadata:
        name: "xplane-eks-cluster-securitygroups"
      spec:
        target: Default
        source: |
          oxr = option("params").oxr

          clustersg = {
            apiVersion = "ec2.aws.m.upbound.io/v1beta1"
            kind = "SecurityGroup"
            metadata.name = oxr.spec.name + "-xplane-eks-cluster-securitygroup"
            metadata.namespace = oxr.metadata.namespace
            spec.forProvider = {
              name = oxr.spec.name + "-xplane-eks-cluster-securitygroup"
              description = "Security Group for EKS Control Plane"
              region = oxr.spec.location
              vpcIdRef.name = oxr.spec.vpcRef + "-xplane-vpc"
              tags: {
                Name = oxr.spec.name + "-xplane-eks-cluster-securitygroup"
                Owner = "linus.yong"
                Environment = "sandbox"
                Project = "crossplane"
              }
            }
            spec.providerConfigRef = {
              kind = "ProviderConfig"
              name = "provider-aws-ec2"
            }
          }

          nodesg = {
            apiVersion = "ec2.aws.m.upbound.io/v1beta1"
            kind = "SecurityGroup"
            metadata.name = oxr.spec.name + "-xplane-eks-node-securitygroup"
            metadata.namespace = oxr.metadata.namespace
            spec.forProvider = {
              name = oxr.spec.name + "-xplane-eks-node-securitygroup"
              description = "Security Group for EKS Nodes"
              region = oxr.spec.location
              vpcIdRef.name = oxr.spec.vpcRef + "-xplane-vpc"
              tags: {
                Name = oxr.spec.name + "-xplane-eks-node-securitygroup"
                Owner = "linus.yong"
                Environment = "sandbox"
                Project = "crossplane"
              }
            }
            spec.providerConfigRef = {
              kind = "ProviderConfig"
              name = "provider-aws-ec2"
            }
          }

          clusteringressrule = {
            apiVersion = "ec2.aws.m.upbound.io/v1beta1"
            kind = "SecurityGroupIngressRule"
            metadata.name = oxr.spec.name + "-xplane-eks-cluster-securitygroup-ingress-rule"
            metadata.namespace = oxr.metadata.namespace
            spec.forProvider = {
              description = "Security Group Rule for Nodes to communicate with EKS Control Plane"
              region = oxr.spec.location
              ipProtocol = "tcp"
              fromPort = 443
              toPort = 443
              referencedSecurityGroupIdRef.name = oxr.spec.name + "-xplane-eks-node-securitygroup"
              securityGroupIdRef.name = oxr.spec.name + "-xplane-eks-cluster-securitygroup"
              tags: {
                Name = oxr.spec.name + "-xplane-eks-cluster-securitygroup-ingress-rule"
                Owner = "linus.yong"
                Environment = "sandbox"
                Project = "crossplane"
              }
            }
            spec.providerConfigRef = {
              kind = "ProviderConfig"
              name = "provider-aws-ec2"
            }
          }

          clusteregressrule = {
            apiVersion = "ec2.aws.m.upbound.io/v1beta1"
            kind = "SecurityGroupEgressRule"
            metadata.name = oxr.spec.name + "-xplane-eks-cluster-securitygroup-egress-rule"
            metadata.namespace = oxr.metadata.namespace
            spec.forProvider = {
              description = "Security Group Rule for EKS Control Plane to communicate with the Nodes"
              region = oxr.spec.location
              ipProtocol = "tcp"
              fromPort = 1024
              toPort = 65535
              referencedSecurityGroupIdRef.name = oxr.spec.name + "-xplane-eks-node-securitygroup"
              securityGroupIdRef.name = oxr.spec.name + "-xplane-eks-cluster-securitygroup"
              tags: {
                Name = oxr.spec.name + "-xplane-eks-cluster-securitygroup-egress-rule"
                Owner = "linus.yong"
                Environment = "sandbox"
                Project = "crossplane"
              }
            }
            spec.providerConfigRef = {
              kind = "ProviderConfig"
              name = "provider-aws-ec2"
            }
          }

          nodeingressrulenodes = {
            apiVersion = "ec2.aws.m.upbound.io/v1beta1"
            kind = "SecurityGroupIngressRule"
            metadata.name = oxr.spec.name + "-xplane-eks-node-securitygroup-ingress-rule-nodes"
            metadata.namespace = oxr.metadata.namespace
            spec.forProvider = {
              description = "Security Group Rule for communication between Nodes"
              region = oxr.spec.location
              ipProtocol = "-1"
              referencedSecurityGroupIdRef.name = oxr.spec.name + "-xplane-eks-node-securitygroup"
              securityGroupIdRef.name = oxr.spec.name + "-xplane-eks-node-securitygroup"
              tags: {
                Name = oxr.spec.name + "-xplane-eks-node-securitygroup-ingress-rule-nodes"
                Owner = "linus.yong"
                Environment = "sandbox"
                Project = "crossplane"
              }
            }
           spec.providerConfigRef = {
              kind = "ProviderConfig"
              name = "provider-aws-ec2"
            }
          }

          nodeingressrulecluster = {
            apiVersion = "ec2.aws.m.upbound.io/v1beta1"
            kind = "SecurityGroupIngressRule"
            metadata.name = oxr.spec.name + "-xplane-eks-node-securitygroup-ingress-rule-control-plane"
            metadata.namespace = oxr.metadata.namespace
            spec.forProvider = {
              description = "Security Group Rule for EKS Control Plane to communicate with the Nodes"
              region = oxr.spec.location
              ipProtocol = "tcp"
              fromPort = 1024
              toPort = 65535
              referencedSecurityGroupIdRef.name = oxr.spec.name + "-xplane-eks-cluster-securitygroup"
              securityGroupIdRef.name = oxr.spec.name + "-xplane-eks-node-securitygroup"
              tags: {
                Name = oxr.spec.name + "-xplane-eks-node-securitygroup-ingress-rule-control-plane"
                Owner = "linus.yong"
                Environment = "sandbox"
                Project = "crossplane"
              }
            }
            spec.providerConfigRef = {
              kind = "ProviderConfig"
              name = "provider-aws-ec2"
            }
          }

          nodeegressrulecluster = {
            apiVersion = "ec2.aws.m.upbound.io/v1beta1"
            kind = "SecurityGroupEgressRule"
            metadata.name = oxr.spec.name + "-xplane-eks-node-securitygroup-egress-rule-control-plane"
            metadata.namespace = oxr.metadata.namespace
            spec.forProvider = {
              description = "Security Group Rule for the Nodes to communicate with EKS Control Plane"
              region = oxr.spec.location
              cidrIpv4: "0.0.0.0/0"
              ipProtocol = "-1"
              securityGroupIdRef.name = oxr.spec.name + "-xplane-eks-node-securitygroup"
              tags: {
                Name = oxr.spec.name + "-xplane-eks-node-securitygroup-egress-rule-control-plane"
                Owner = "linus.yong"
                Environment = "sandbox"
                Project = "crossplane"
              }
            }
            spec.providerConfigRef = {
              kind = "ProviderConfig"
              name = "provider-aws-ec2"
            }
          }

          items = [clustersg, nodesg, clusteringressrule, clusteregressrule, nodeingressrulenodes, nodeingressrulecluster, nodeegressrulecluster]
  - step: create-eks-cluster
    functionRef:
      name: function-kcl
    input:
      apiVersion: krm.kcl.dev/v1alpha1
      kind: KCLInput
      metadata:
        name: "xplane-eks-cluster"
      spec:
        target: Default
        source: |
          oxr = option("params").oxr

          cluster = {
            apiVersion = "eks.aws.m.upbound.io/v1beta1"
            kind = "Cluster"
            metadata = {
              name = oxr.spec.name + "-xplane-eks-cluster"
              namespace = oxr.metadata.namespace
            }
            spec.forProvider = {
              region = oxr.spec.location
              roleArnRef.name = oxr.spec.name + "-xplane-eks-iam-role"
              version = oxr.spec.components.eks.version
              accessConfig = {
                authenticationMode = "API_AND_CONFIG_MAP"
              }
              bootstrapSelfManagedAddons = False
              vpcConfig = {
                endpointPrivateAccess = True
                endpointPublicAccess = True
                subnetIdRefs = [
                  { name = oxr.spec.name + "-xplane-private-subnet-" + zone } for zone, cidr in oxr.spec.subnets.private
                ]
                securityGroupIdSelector.matchControllerRef = True
              }
              tags: {
                Name = oxr.spec.name + "-xplane-eks-cluster"
                Owner = "linus.yong"
                Environment = "sandbox"
                Project = "crossplane"
              }
            }
            spec.providerConfigRef = {
              kind = "ProviderConfig"
              name = "provider-aws-eks"
            }
          }

          defaultaccessentry = {
            apiVersion = "eks.aws.m.upbound.io/v1beta1"
            kind = "AccessEntry"
            metadata = {
              name = oxr.spec.name + "-xplane-eks-default-access-entry"
              namespace = oxr.metadata.namespace
            }
            spec.forProvider = {
              region = oxr.spec.location
              clusterNameRef.name = oxr.spec.name + "-xplane-eks-cluster"
              principalArn = "arn:aws:iam::" + oxr.spec.awsAccountId + ":role/aws-reserved/sso.amazonaws.com/ap-southeast-1/AWSReservedSSO_sso_sandbox_admin_permission_set_a380a3efed7cd9a1"
              tags: {
                Name = oxr.spec.name + "-xplane-eks-default-access-entry"
                Owner = "linus.yong"
                Environment = "sandbox"
                Project = "crossplane"
              }
            }
            spec.providerConfigRef = {
              kind = "ProviderConfig"
              name = "provider-aws-eks"
            }
          }

          defaultaccesspolicyassociation = {
            apiVersion = "eks.aws.m.upbound.io/v1beta1"
            kind = "AccessPolicyAssociation"
            metadata = {
              name = oxr.spec.name + "-xplane-eks-default-access-policy-association"
              namespace = oxr.metadata.namespace
            }
            spec.forProvider = {
              region = oxr.spec.location
              clusterNameRef.name = oxr.spec.name + "-xplane-eks-cluster"
              accessScope.type = "cluster"
              policyArn = "arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy"
              principalArnRef.name =  oxr.spec.name + "-xplane-eks-default-access-entry"
            }
            spec.providerConfigRef = {
              kind = "ProviderConfig"
              name = "provider-aws-eks"
            }
          }

          crossplaneaccessentry = {
            apiVersion = "eks.aws.m.upbound.io/v1beta1"
            kind = "AccessEntry"
            metadata = {
              name = oxr.spec.name + "-xplane-eks-crossplane-access-entry"
              namespace = oxr.metadata.namespace
            }
            spec.forProvider = {
              region = oxr.spec.location
              clusterNameRef.name = oxr.spec.name + "-xplane-eks-cluster"
              principalArn = "arn:aws:iam::" + oxr.spec.awsAccountId + ":role/eksac-control-plane-crossplane-iam-role"
              tags: {
                Name = oxr.spec.name + "-xplane-eks-crossplane-access-entry"
                Owner = "linus.yong"
                Environment = "sandbox"
                Project = "crossplane"
              }
            }
            spec.providerConfigRef = {
              kind = "ProviderConfig"
              name = "provider-aws-eks"
            }
          }

          crossplaneaccesspolicyassociation = {
            apiVersion = "eks.aws.m.upbound.io/v1beta1"
            kind = "AccessPolicyAssociation"
            metadata = {
              name = oxr.spec.name + "-xplane-eks-crossplane-access-policy-association"
              namespace = oxr.metadata.namespace
            }
            spec.forProvider = {
              region = oxr.spec.location
              clusterNameRef.name = oxr.spec.name + "-xplane-eks-cluster"
              accessScope.type = "cluster"
              policyArn = "arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy"
              principalArnRef.name =  oxr.spec.name + "-xplane-eks-crossplane-access-entry"
            }
            spec.providerConfigRef = {
              kind = "ProviderConfig"
              name = "provider-aws-eks"
            }
          }

          karpenteraccessentry = {
            apiVersion = "eks.aws.m.upbound.io/v1beta1"
            kind = "AccessEntry"
            metadata = {
              name = oxr.spec.name + "-xplane-eks-karpenter-access-entry"
              namespace = oxr.metadata.namespace
            }
            spec.forProvider = {
              region = oxr.spec.location
              clusterNameRef.name = oxr.spec.name + "-xplane-eks-cluster"
              principalArn = "arn:aws:iam::" + oxr.spec.awsAccountId + ":role/" + oxr.spec.name + "-xplane-karpenter-node-iam"
              type = "EC2_LINUX"
              tags: {
                Name = oxr.spec.name + "-xplane-eks-karpenter-access-entry"
                Owner = "linus.yong"
                Environment = "sandbox"
                Project = "crossplane"
              }
            }
            spec.providerConfigRef = {
              kind = "ProviderConfig"
              name = "provider-aws-eks"
            }
          }

          items = [cluster, defaultaccessentry, defaultaccesspolicyassociation, crossplaneaccessentry, crossplaneaccesspolicyassociation, karpenteraccessentry]
  - step: create-pod-identity-agent-addon
    functionRef:
      name: function-kcl
    input:
      apiVersion: krm.kcl.dev/v1alpha1
      kind: KCLInput
      metadata:
        name: "xplane-eks-addon-pod-identity-agent"
      spec:
        target: Default
        source: |
          oxr = option("params").oxr

          items = [{
            apiVersion = "eks.aws.m.upbound.io/v1beta1"
            kind = "Addon"
            metadata = {
              name = oxr.spec.name + "-xplane-eks-addon-pod-identity-agent"
              namespace = oxr.metadata.namespace
            }
            spec.forProvider = {
              region = oxr.spec.location
              addonName = "eks-pod-identity-agent"
              addonVersion = oxr.spec.components.podidentityagentAddOn.version
              clusterNameRef.name = oxr.spec.name + "-xplane-eks-cluster"
            }
            spec.providerConfigRef = {
              kind = "ProviderConfig"
              name = "provider-aws-eks"
            }
          }]
  - step: create-ebs-csi-addon
    functionRef:
      name: function-kcl
    input:
      apiVersion: krm.kcl.dev/v1alpha1
      kind: KCLInput
      metadata:
        name: "xplane-eks-addon-ebs-csi"
      spec:
        target: Default
        source: |
          import json

          oxr = option("params").oxr
          ocds = option("params").ocds

          ebscsiiamrole = {
            apiVersion = "iam.aws.m.upbound.io/v1beta1"
            kind = "Role"
            metadata = {
              name = oxr.spec.name + "-xplane-eks-addon-ebs-csi-iam-role"
              namespace = oxr.metadata.namespace
            }
            spec.forProvider = {
              assumeRolePolicy = json.encode({
                Version = "2012-10-17"
                Statement = [        {
                  "Sid": "AllowEksAuthToAssumeRoleForPodIdentity",
                  "Effect": "Allow",
                  "Principal": {
                      "Service": "pods.eks.amazonaws.com"
                  },
                  "Action": [
                      "sts:AssumeRole",
                      "sts:TagSession"
                  ]
                }]
              })
              managedPolicyArns = [
                "arn:aws:iam::aws:policy/service-role/AmazonEBSCSIDriverPolicy"
              ]
              tags: {
                Name = oxr.spec.name + "-xplane-eks-addon-ebs-csi-iam-role"
                Owner = "linus.yong"
                Environment = "sandbox"
                Project = "crossplane"
              }
            }
            spec.providerConfigRef = {
              kind = "ProviderConfig"
              name = "provider-aws-iam"
            }
          }

          ebscsipodidentityassociation = {
            apiVersion = "eks.aws.m.upbound.io/v1beta1"
            kind = "PodIdentityAssociation"
            metadata = {
              name = oxr.spec.name + "-xplane-ebs-csi-pod-identity-association"
              namespace = oxr.metadata.namespace
            }
            spec.forProvider = {
              region = oxr.spec.location
              clusterNameRef.name = oxr.spec.name + "-xplane-eks-cluster"
              roleArnRef.name = oxr.spec.name + "-xplane-eks-addon-ebs-csi-iam-role"
              namespace = "kube-system"
              serviceAccount = "ebs-csi-controller-sa"
              tags: {
                Name = oxr.spec.name + "-xplane-ebs-csi-pod-identity-association"
                Owner = "linus.yong"
                Environment = "sandbox"
                Project = "crossplane"
              }
            }
            spec.providerConfigRef = {
              kind = "ProviderConfig"
              name = "provider-aws-eks"
            }
          }

          ebscsiaddon = {
            apiVersion = "eks.aws.m.upbound.io/v1beta1"
            kind = "Addon"
            metadata = {
              name = oxr.spec.name + "-xplane-eks-addon-aws-ebs-csi-driver"
              namespace = oxr.metadata.namespace
            }
            spec.forProvider = {
              region = oxr.spec.location
              addonName = "aws-ebs-csi-driver"
              addonVersion = oxr.spec.components.ebscsiAddOn.version
              clusterNameRef.name = oxr.spec.name + "-xplane-eks-cluster"
              configurationValues: json.encode({
                "controller": {
                  "replicaCount": 1,
                  "tolerations": [
                    {
                      "key": "karpenter.sh/nodepool",
                      "operator": "Equal",
                      "value": "infra",
                      "effect": "NoSchedule"
                    },
                    {
                      "key": "CriticalAddonsOnly",
                      "operator": "Exists"
                    },
                    {
                      "effect": "NoExecute",
                      "operator": "Exists",
                      "tolerationSeconds": 300
                    }
                  ]
                },
                "node": {
                  "tolerations": [
                    {
                      "key": "karpenter.sh/nodepool",
                      "operator": "Equal",
                      "value": "infra",
                      "effect": "NoSchedule"
                    },
                    {
                      "effect": "NoExecute",
                      "operator": "Exists",
                      "tolerationSeconds": 300
                    }
                  ]
                }
              })

              podIdentityAssociation = [
                {
                  roleArn = ocds[oxr.spec.name + "-xplane-eks-addon-ebs-csi-iam-role"]?.Resource?.status?.atProvider?.arn
                  serviceAccount = "ebs-csi-controller-sa"
                }
              ]
            }
            spec.providerConfigRef = {
              kind = "ProviderConfig"
              name = "provider-aws-eks"
            }
          }

          items = [ebscsiiamrole, ebscsiaddon]
  - step: create-eks-cluster-auth
    functionRef:
      name: function-kcl
    input:
      apiVersion: krm.kcl.dev/v1alpha1
      kind: KCLInput
      metadata:
        name: "xplane-eks-cluster-auth"
      spec:
        target: Default
        source: |
          oxr = option("params").oxr

          items = [{
            apiVersion = "eks.aws.m.upbound.io/v1beta1"
            kind = "ClusterAuth"
            metadata = {
              name = oxr.spec.name + "-xplane-eks-cluster-auth"
              namespace = oxr.metadata.namespace
            }
            spec.forProvider = {
              region = oxr.spec.location
              clusterNameRef.name = oxr.spec.name + "-xplane-eks-cluster"
            }
            spec.writeConnectionSecretToRef = {
              name = oxr.spec.name + "-xplane-eks-cluster-auth"
            }
            spec.providerConfigRef = {
              kind = "ProviderConfig"
              name = "provider-aws-eks"
            }
          }]
  - step: create-oidc-provider
    functionRef:
      name: function-kcl
    input:
      apiVersion: krm.kcl.dev/v1alpha1
      kind: KCLInput
      metadata:
        name: "xplane-eks-cluster-auth"
      spec:
        target: Default
        source: |
          oxr = option("params").oxr
          ocds = option("params").ocds

          items = [{
            apiVersion = "iam.aws.m.upbound.io/v1beta1"
            kind = "OpenIDConnectProvider"
            metadata = {
              name = oxr.spec.name + "-xplane-oidc-provider"
              namespace = oxr.metadata.namespace
            }
            spec.forProvider = {
              clientIdList = ["sts.amazonaws.com"]
              thumbprintList = ["9e99a48a9960b14926bb7f3b02e22da2b0ab7280"]
              url = ocds[oxr.spec.name + "-xplane-eks-cluster"]?.Resource?.status?.atProvider?.identity?[0]?.oidc?[0]?.issuer or ""
              tags: {
                Name = oxr.spec.name + "-xplane-oidc-provider"
                Owner = "linus.yong"
                Environment = "sandbox"
                Project = "crossplane"
              }
            }
            spec.providerConfigRef = {
              kind = "ProviderConfig"
              name = "provider-aws-iam"
            }
          }]
