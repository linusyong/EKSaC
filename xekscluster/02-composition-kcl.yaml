                      }
                    ]
                    tags = {
                      Name = oxr.spec.name + "-xplane"
                      Owner = "linus.yong"
                      Environment = "sandbox"
                      Project = "crossplane"
                    }
                  }
                }
              }
              managementPolicies = ["Create", "Update", "Observe"]
              providerConfigRef.name = oxr.spec.name + "-providerconfig-kubernetes"
              providerConfigRef = {
                kind = "ProviderConfig"
                name = oxr.spec.name + "-providerconfig-kubernetes"
              }
            }
          }]
  - step: create-default-arm64-nodepool-karpenter
    functionRef:
      name: function-kcl
    input:
