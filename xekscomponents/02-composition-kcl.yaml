apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: x-ekscomponent-kcl
spec:
  compositeTypeRef:
    apiVersion: consumable.minisrc.com/v1alpha1
    kind: xEksComponentKcl
  mode: Pipeline
  pipeline:
  - step: create-istio-system-namespace
    functionRef:
      name: function-kcl
    input:
      apiVersion: krm.kcl.dev/v1alpha1
      kind: KCLInput
      metadata:
        name: "xplane-istio-system-namespace"
      spec:
        target: Default
        source: |
          oxr = option("params").oxr

          items = [{
            apiVersion = "kubernetes.crossplane.io/v1alpha2"
            kind = "Object"
            metadata.name = oxr.spec.name + "-xplane-istio-system-namespace"
            spec = {
              forProvider = {
                manifest = {
                  apiVersion = "v1"
                  kind = "Namespace"
                  metadata.name = "istio-system"
                }
              }
              providerConfigRef.name = oxr.spec.clusterRef + "-providerconfig-kubernetes"
            }
          }]
  - step: create-istio-certs-secret
    functionRef:
      name: function-kcl
    input:
      apiVersion: krm.kcl.dev/v1alpha1
      kind: KCLInput
      metadata:
        name: "xplane-istio-certs-secret"
      spec:
        target: Default
        source: |
          oxr = option("params").oxr

          items = [{
            apiVersion = "kubernetes.crossplane.io/v1alpha2"
            kind = "Object"
            metadata.name = oxr.spec.name + "-xplane-istio-certs-secret"
            spec = {
              forProvider = {
                manifest = {
                  apiVersion = "v1"
                  kind = "Secret"
                  metadata.name = "cacerts"
                  metadata.namespace = "istio-system"
                  type = "Opaque"
                  data = {
                    "ca-cert.pem": ""
                    "ca-key.pem": ""
                    "cert-chain.pem": ""
                    "root-cert.pem": ""
                  }
                }
              }
              providerConfigRef.name = oxr.spec.clusterRef + "-providerconfig-kubernetes"
            }
          }]
  - step: helm-install-istio-base
    functionRef:
      name: function-kcl
    input:
      apiVersion: krm.kcl.dev/v1alpha1
      kind: KCLInput
      metadata:
        name: "xplane-helm-istio-base"
      spec:
        target: Default
        source: |
          oxr = option("params").oxr

          items = [{
            apiVersion = "helm.crossplane.io/v1beta1"
            kind = "Release"
            metadata.name = oxr.spec.name + "-xplane-helm-istio-base"
            metadata.annotations = {
                "crossplane.io/external-name" = "istio-base"
            }
            spec = {
              forProvider = {
                chart = {
                  name = "base"
                  repository = "https://istio-release.storage.googleapis.com/charts"
                  version = oxr.spec.components.istioHelm.version
                }
                namespace = "istio-system"
                wait = True
              }
              providerConfigRef.name = oxr.spec.clusterRef + "-providerconfig-helm"
            }
          }]
  - step: helm-install-istio-cni
    functionRef:
      name: function-kcl
    input:
      apiVersion: krm.kcl.dev/v1alpha1
      kind: KCLInput
      metadata:
        name: "xplane-helm-istio-cni"
      spec:
        target: Default
        source: |
          oxr = option("params").oxr

          items = [{
            apiVersion = "helm.crossplane.io/v1beta1"
            kind = "Release"
            metadata.name = oxr.spec.name + "-xplane-helm-istio-cni"
            metadata.annotations = {
                "crossplane.io/external-name" = "istio-cni"
            }
            spec = {
              forProvider = {
                chart = {
                  name = "cni"
                  repository = "https://istio-release.storage.googleapis.com/charts"
                  version = oxr.spec.components.istioHelm.version
                }
                namespace = "istio-system"
                set = [
                  {
                    name = "profile"
                    value = "ambient"
                  }
                ]
                values = {
                  affinity = {
                    nodeAffinity = {
                      requiredDuringSchedulingIgnoredDuringExecution = {
                        nodeSelectorTerms = [
                          {
                            matchExpressions = [
                              {
                                key = "eks.amazonaws.com/compute-type"
                                operator = "NotIn"
                                values = ["fargate"]
                              }
                            ]
                          }
                        ]
                      }
                    }
                  }
                }
                wait = True
              }
              providerConfigRef.name = oxr.spec.clusterRef + "-providerconfig-helm"
            }
          }]
  - step: helm-install-istiod
    functionRef:
      name: function-kcl
    input:
      apiVersion: krm.kcl.dev/v1alpha1
      kind: KCLInput
      metadata:
        name: "xplane-helm-istiod"
      spec:
        target: Default
        source: |
          oxr = option("params").oxr

          items = [{
            apiVersion = "helm.crossplane.io/v1beta1"
            kind = "Release"
            metadata.name = oxr.spec.name + "-xplane-helm-istiod"
            metadata.annotations = {
                "crossplane.io/external-name" = "istiod"
            }
            spec = {
              forProvider = {
                chart = {
                  name = "istiod"
                  repository = "https://istio-release.storage.googleapis.com/charts"
                  version = oxr.spec.components.istioHelm.version
                }
                namespace = "istio-system"
                set = [
                  {
                    name = "profile"
                    value = "ambient"
                  },
                  {
                    name = "global.meshID"
                    value = "mesh1"
                  },
                  {
                    name = "global.network"
                    value = "network1"
                  },
                  {
                    name = "global.multiCluster.clusterName"
                    value = oxr.spec.clusterRef
                  }
                ]
                wait = True
              }
              providerConfigRef.name = oxr.spec.clusterRef + "-providerconfig-helm"
            }
          }]
  - step: helm-install-ztunnel
    functionRef:
      name: function-kcl
    input:
      apiVersion: krm.kcl.dev/v1alpha1
      kind: KCLInput
      metadata:
        name: "xplane-helm-ztunnel"
      spec:
        target: Default
        source: |
          oxr = option("params").oxr

          items = [{
            apiVersion = "helm.crossplane.io/v1beta1"
            kind = "Release"
            metadata.name = oxr.spec.name + "-xplane-helm-ztunnel"
            metadata.annotations = {
                "crossplane.io/external-name" = "ztunnel"
            }
            spec = {
              forProvider = {
                chart = {
                  name = "ztunnel"
                  repository = "https://istio-release.storage.googleapis.com/charts"
                  version = oxr.spec.components.istioHelm.version
                }
                namespace = "istio-system"
                set = [
                  {
                    name = "multiCluster.clusterName"
                    value = oxr.spec.clusterRef
                  }
                ]
                values = {
                  affinity = {
                    nodeAffinity = {
                      requiredDuringSchedulingIgnoredDuringExecution = {
                        nodeSelectorTerms = [
                          {
                            matchExpressions = [
                              {
                                key = "eks.amazonaws.com/compute-type"
                                operator = "NotIn"
                                values = ["fargate"]
                              }
                            ]
                          }
                        ]
                      }
                    }
                  }
                }
                wait = True
              }
              providerConfigRef.name = oxr.spec.clusterRef + "-providerconfig-helm"
            }
          }]
