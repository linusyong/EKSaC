apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: x-vpc
spec:
  compositeTypeRef:
    apiVersion: consumable.trustbank.sg/v1alpha1
    kind: xVpc
  patchSets:
  - name: region-patchset
    patches:
    - type: FromCompositeFieldPath
      fromFieldPath: "spec.location"
      toFieldPath: "spec.forProvider.region"
  resources:
  - name: x-vpc
    base:
      apiVersion: ec2.aws.upbound.io/v1beta1
      kind: VPC
      metadata:
        name: xplane-vpc
      spec:
        managementPolicies: 
        - "Create"
        - "Observe"
        - "Update"
        forProvider:
          region: ap-southeast-1
          cidrBlock: 10.0.0.0/16
          enableDnsHostnames: true
          enableDnsSupport: true
          tags:
            Name: xplane-vpc
            Owner: linus.yong
            Environment: sandbox
            Project: crossplane
        providerConfigRef:
          name: provider-aws-ec2
    patches:
    - type: PatchSet
      patchSetName: region-patchset
    - type: FromCompositeFieldPath
      fromFieldPath: spec.paused
      toFieldPath: metadata.annotations[crossplane.io/paused]
    - type: FromCompositeFieldPath
      fromFieldPath: spec.externalName
      toFieldPath: metadata.annotations[crossplane.io/external-name]
    - type: FromCompositeFieldPath
      fromFieldPath: spec.allowDeleteion
      toFieldPath: spec.managementPolicies[3]
      transforms:
        - type: map
          map: 
            true: "Delete"
    - type: CombineFromComposite
      combine:
        variables:
        - fromFieldPath: spec.name
        strategy: string
        string:
          fmt: "%s-xplane-vpc"
      toFieldPath: metadata.name
    - type: CombineFromComposite
      combine:
        variables:
        - fromFieldPath: spec.name
        strategy: string
        string:
          fmt: "%s-xplane-vpc"
      toFieldPath: spec.forProvider.tags.Name
    - type: FromCompositeFieldPath
      fromFieldPath: spec.vpcCidr
      toFieldPath: spec.forProvider.cidrBlock