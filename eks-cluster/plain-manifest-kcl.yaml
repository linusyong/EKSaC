apiVersion: consumable.trustbank.sg/v1alpha1
kind: xNetwork
metadata:
  name: linus-network
  namespace: eksac
spec:
  name: linus-network
  location: "ap-southeast-1"
  vpcCidr: "10.0.0.0/22"
  subnets:
    public:
      1a: "10.0.0.0/28"
      1b: "10.0.0.16/28"
      1c: "10.0.0.32/28"
---
apiVersion: consumable.trustbank.sg/v1alpha1
kind: xEksCluster
metadata:
  name: linus-cluster
  namespace: eksac
spec:
  name: linus-cluster
  location: "ap-southeast-1"
  awsAccountId: "390945758345"
  vpcRef: linus-network
  subnets:
    private:
      1a: "10.0.0.128/25"
      1b: "10.0.1.0/25"
      1c: "10.0.1.128/25"
  components:
    awsloadbalancercontrollerHelm:
      version: "1.14.1"
    argocdHelm:
      version: "9.0.3"
    ciliumHelm:
      version: "1.18.3"
    corednsHelm:
      version: "1.45.0"
    ebscsiAddOn:
      version: "v1.51.1-eksbuild.1"
    eks:
      version: "1.34"
    karpenterHelm:
      version: "1.8.1"
    metricsserverHelm:
      version: "3.13.0"
    podidentityagentAddOn:
      version: "v1.3.9-eksbuild.3"
---
