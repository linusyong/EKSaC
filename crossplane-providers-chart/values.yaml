provider:
  awsFamily:
    ## https://marketplace.upbound.io/providers/upbound/provider-family-aws/
    name: aws-provider
    accountId: "390945758345"
    crossplaneIamRoleName: "eksac-control-plane-crossplane-iam-role"
    region: ap-southeast-1
    deploymentRuntimeConfig:
      name: aws-deployment-runtime-config
      deploymentTemplate:
        spec:
          replicas: 1
    version: v2
    # version: v2.1.1
    providers:
    - name: provider-aws-ec2
      providerConfig:
        credentials:
          source: IRSA
    - name: provider-aws-eks
      providerConfig:
        credentials:
          source: IRSA
    - name: provider-aws-iam
      providerConfig:
        credentials:
          source: IRSA
  helm:
    ## https://marketplace.upbound.io/providers/upbound/provider-helm/
    version: v1
    # version: v1.0.3
  kubernetes:
    ## https://marketplace.upbound.io/providers/upbound/provider-kubernetes/
    version: v1
    # version: v1.0.1
    providers:
    - name: provider-kubernetes
      providerConfig:
        credentials:
          source: InjectedIdentity
function:
  kcl:
    version: v0.11.5
  autoready:
    version: v0.5.1
  sequencer:
    version: v0.3.0